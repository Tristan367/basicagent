<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Assistant">
  <!-- The window icon, which was Chromium's blank-document circle until now.
       A speech bubble, because the whole app is that you say a thing and it
       gets made, with a cursor caret inside it where a face or a gear would
       usually go: talking, and the thing that gets written. Flat colour and
       thick strokes, because it is drawn at 16px more often than not. -->
  <rect width="64" height="64" rx="14" fill="#9cb24b"/>
  <path d="M13 21a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H29l-10 8v-8h-0a6 6 0 0 1-6-6z"
        fill="#17191c"/>
  <path d="M25 24l-5 5 5 5M39 24l5 5-5 5" fill="none" stroke="#9cb24b"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
