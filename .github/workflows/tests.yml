name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every version the README tells somebody to install. A claim about which
      # Pythons work is a claim worth checking, and the one that broke was the
      # newest -- a dependency stopped publishing a wheel and nothing noticed
      # until an install failed on a computer bought that year.
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Tests
        # Nothing here bills an API; the `live` tests are excluded by pyproject.
        run: python -m pytest -q

      - name: The browser half of the app parses
        run: |
          node --check web_ui/static/js/app.js
          node --check web_ui/static/js/settings.js

      - name: The installer runs on a clean checkout
        # --minimal skips the ~1 GB of speech models; --no-shortcut keeps it
        # from writing into a runner's home directory. What is being checked is
        # that the environment builds and the app imports, which is the step
        # every single user takes and no developer ever repeats.
        run: |
          python install.py --minimal --no-shortcut
          .venv/bin/python -c "from agent_server.main import app; print(app.title)"
