# Cutting a release.
#
# Triggered by pushing a tag: `git tag v1.0.1 && git push origin v1.0.1`.
# Nothing else. There is no button to press and no form to fill in, because the
# whole point is that a release is cheap enough to do the moment a fix is ready.
#
# The tests run first and the release does not happen if they fail. Shipping a
# broken version to people who cannot debug it is worse than shipping nothing,
# and they will all be told about it within a day by the update check.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      # The tag and the VERSION file have to agree. They are two statements of
      # the same fact, and the app compares the file against the tag to decide
      # whether an update exists -- so a mismatch means either everybody is
      # told to update forever, or nobody is ever told at all.
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag file=$file"
          test "$tag" = "$file"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

  publish:
    needs: check
    runs-on: ubuntu-latest
    # `id-token` and `attestations` are what let GitHub sign a statement that
    # this exact zip came out of this exact commit. See the attest step below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # What a stranger unzips: one download per computer, so the folder
      # holds the single file for the machine it is sitting on. The rules
      # behind the layout, and the checks that they still hold, live in the
      # builder itself -- where they can be run by hand and read by somebody
      # deciding whether to trust this.
      - name: Build the downloads
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/make_download.py "$version" --out dist
          for zip in dist/*.zip; do
            unzip -p "$zip" "app/VERSION" | grep -qx "$version" \
              || { echo "$zip does not contain version $version"; exit 1; }
          done
          ls -la dist/
          echo "sha=$(sha256sum dist/Assistant-Setup-Windows.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # A receipt, signed by GitHub, saying this zip was built by this workflow
      # from this commit -- so "the download is the source code you can read"
      # stops being something people have to take on trust.
      #
      # This is the only honest answer available at the moment. A code-signing
      # certificate is what stops Windows and macOS warning about an unknown
      # publisher, and there isn't one; this at least means the claim on the
      # download page is checkable rather than a promise.
      - name: Sign a receipt for the download
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **The [download page](https://tristan367.github.io/basicagent/)
            picks the right one for your computer.** Or take it by hand:
            [Windows](https://github.com/Tristan367/basicagent/releases/latest/download/Assistant-Setup-Windows.zip)
            · [Mac](https://github.com/Tristan367/basicagent/releases/latest/download/Assistant-Setup-Mac.zip)
            · [Linux](https://github.com/Tristan367/basicagent/releases/latest/download/Assistant-Setup-Linux.zip).
            Each holds one installer and nothing to choose between.

            <details><summary>Checking that this is what it says it is</summary>

            This file was built by GitHub from the source in this repository,
            not on anybody's laptop. GitHub signed a statement saying so, which
            anyone can check:

            ```
            gh attestation verify Assistant-Setup-Windows.zip -R Tristan367/basicagent
            ```

            SHA-256 (Windows): `${{ env.sha }}`
            </details>
