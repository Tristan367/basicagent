# Cutting a release.
#
# Triggered by pushing a tag: `git tag v1.0.1 && git push origin v1.0.1`.
# Nothing else. There is no button to press and no form to fill in, because the
# whole point is that a release is cheap enough to do the moment a fix is ready.
#
# The tests run first and the release does not happen if they fail. Shipping a
# broken version to people who cannot debug it is worse than shipping nothing,
# and they will all be told about it within a day by the update check.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      # The tag and the VERSION file have to agree. They are two statements of
      # the same fact, and the app compares the file against the tag to decide
      # whether an update exists -- so a mismatch means either everybody is
      # told to update forever, or nobody is ever told at all.
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag file=$file"
          test "$tag" = "$file"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

  publish:
    needs: check
    runs-on: ubuntu-latest
    # `id-token` and `attestations` are what let GitHub sign a statement that
    # this exact zip came out of this exact commit. See the attest step below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # What a stranger unzips. Two rules decide the layout, and both were
      # written after somebody actually did it:
      #
      # 1. No wrapper folder inside the zip. Windows Explorer and macOS
      #    Archive Utility both create a folder named after the archive, so a
      #    zip that contains one as well produces a folder sitting inside an
      #    identically named folder. The fix is to zip the contents, not the
      #    directory.
      # 2. Four things at the top, not twenty. install.py beside install.sh
      #    beside install.bat beside pyproject.toml is a dozen wrong answers
      #    surrounding the right one, for a person who was promised this was
      #    not technical. Everything the app is made of goes in `app`.
      #
      # The name is fixed rather than versioned, so the download button on the
      # page can link straight at the file instead of at a release page asking
      # somebody which of three assets they want. The version is in the readme,
      # in app/VERSION, and in the app itself.
      - name: Build the download
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p staging/app
          rsync -a --exclude '.git' --exclude '.github' --exclude '.venv' \
                --exclude '__pycache__' --exclude '.pytest_cache' \
                --exclude '.ruff_cache' --exclude '/staging' --exclude '/docs' \
                --exclude '/Install on *' --exclude '/Read me first.txt' \
                ./ staging/app/
          cp "Install on Windows.bat" "Install on Mac.command" \
             "Install on Linux.sh" staging/
          sed "s/__VERSION__/$version/" "Read me first.txt" > "staging/Read me first.txt"
          chmod +x "staging/Install on Mac.command" "staging/Install on Linux.sh"

          # What a stranger unzips is what they were promised.
          for needed in "Install on Windows.bat" "Install on Mac.command" \
                        "Install on Linux.sh" "Read me first.txt" \
                        app/install.py app/basicagent.py app/VERSION \
                        app/requirements.txt app/Assistant.bat app/Assistant.command; do
            test -e "staging/$needed" || { echo "missing from the zip: $needed"; exit 1; }
          done
          test ! -e staging/app/app || { echo "the zip contains itself"; exit 1; }
          test ! -e "staging/install.py" || { echo "app internals leaked to the top"; exit 1; }
          # Stripped of carriage returns first: the readme ships with Windows
          # line endings, because Notepad is what will open it. Every check in
          # this step says what it found when it fails, or a silent exit 1
          # sends somebody reading raw workflow logs to find out which line.
          tr -d '\r' < "staging/Read me first.txt" | grep -q "^Assistant $version$" \
            || { echo "the readme does not say it is version $version"; exit 1; }

          ( cd staging && zip -qr ../Assistant-Setup.zip . )
          unzip -l Assistant-Setup.zip | head -20
          echo "zip=Assistant-Setup.zip" >> "$GITHUB_ENV"
          echo "sha=$(sha256sum Assistant-Setup.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # A receipt, signed by GitHub, saying this zip was built by this workflow
      # from this commit -- so "the download is the source code you can read"
      # stops being something people have to take on trust.
      #
      # This is the only honest answer available at the moment. A code-signing
      # certificate is what stops Windows and macOS warning about an unknown
      # publisher, and there isn't one; this at least means the claim on the
      # download page is checkable rather than a promise.
      - name: Sign a receipt for the download
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: Assistant-Setup.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: Assistant-Setup.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **[Download Assistant ${{ github.ref_name }}](https://github.com/Tristan367/basicagent/releases/latest/download/Assistant-Setup.zip)**
            — unzip it and open the installer for your computer. There is a
            `Read me first.txt` inside, and fuller instructions on the
            [download page](https://tristan367.github.io/basicagent/).

            <details><summary>Checking that this is what it says it is</summary>

            This file was built by GitHub from the source in this repository,
            not on anybody's laptop. GitHub signed a statement saying so, which
            anyone can check:

            ```
            gh attestation verify ${{ env.zip }} -R Tristan367/basicagent
            ```

            SHA-256: `${{ env.sha }}`
            </details>
